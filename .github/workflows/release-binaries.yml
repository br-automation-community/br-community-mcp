name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: br-community-mcp-windows-x64
            asset_path: dist/br-community-mcp-windows-x64.exe
            # Legacy name (<= v1.1.1) still consumed by Support Agent's download script
            legacy_asset_path: dist/br-community-mcp.exe
          - os: macos-26
            artifact_name: br-community-mcp-macos-arm64
            asset_path: dist/br-community-mcp-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build binary
        run: uv run python build.py --clean

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/br-community-mcp.exe "${{ matrix.asset_path }}"

      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: mv dist/br-community-mcp "${{ matrix.asset_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_path }}" --repo "${{ github.repository }}"

      - name: Upload legacy-named release asset
        if: github.event_name == 'release' && matrix.legacy_asset_path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.legacy_asset_path }}" --repo "${{ github.repository }}"
